<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h2 align="center">Student Registration Form</h2>
    <hr>

  <form action="submit.html">
  <label for="full name">Full Name</label>
  <input type="text" placeholder="Enter your full name" required><br><br>
  <label for="Email">Email</label>
  <input type="Email" placeholder="Enter valid Email adress" required><br><br>
  <label for="password">Password</label>
  <input type="password" placeholder="enter password" required><br><br>
  <label for="gender">Gender</label>
  <input type="radio" name="gender" value="male">Male
  <input type="radio" name="gender" value="female">Female
  <input type="radio" name="gender" value="other">Other
  <br><br>
  <label for="course">Course</label>
  <select required>
    <option>-- Select course --</option>
    <option value="BCA">BCA</option>
    <option value="BTECH">BTECH</option>
    <option value="BBA">BBA</option>
  </select><br><br>
  <label for="contact no.">Contact No.</label>
  <input type="tel" placeholder="Enter phone no." required><br><br>
  <label for="Address">Address</label>
  <textarea rows="4" cols="30" placeholder="enter your Address"></textarea>
  <br><br>
  <input type="submit" value="Register">
  <input type="reset" value="Clear">
  </form>
  <hr>
  <p align="center">&copy; 2026 student registration portal</p> 




</body>
</html>
